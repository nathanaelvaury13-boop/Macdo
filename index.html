<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cobalt - Formation</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1020;
color:white;
}

header{
padding:50px;
text-align:center;
background:radial-gradient(circle at top,#1d4ed8,#0b1020);
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

h1{
font-size:40px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
margin-top:30px;
}

.card{
background:#121a30;
padding:15px;
border-radius:15px;
border:1px solid rgba(255,255,255,0.1);
}

.card h3{
margin:10px 0;
}

iframe{
width:100%;
height:200px;
border-radius:10px;
border:none;
}

.badge{
display:inline-block;
padding:6px 12px;
background:#2563eb;
border-radius:999px;
margin-bottom:10px;
font-size:12px;
}
</style>

</head>

<body>

<header>
<h1>🎓 Cobalt Formation</h1>
<p>Bienvenue dans ton espace de cours</p>
</header>

<div class="container">

<div class="badge">Module 1 - HTML & CSS</div>

<div class="grid">

<div class="card">
<h3>Introduction HTML</h3>
<iframe src="https://www.youtube.com/embed/UB1O30fR-EE" allowfullscreen></iframe>
</div>

<div class="card">
<h3>CSS de base</h3>
<iframe src="https://www.youtube.com/embed/yfoY53QXEnI" allowfullscreen></iframe>
</div>

<div class="card">
<h3>Flexbox expliqué</h3>
<iframe src="https://www.youtube.com/embed/JJSoEo8JSnc" allowfullscreen></iframe>
</div>

</div>

<div class="badge" style="margin-top:40px;">Module 2 - JavaScript</div>

<div class="grid">

<div class="card">
<h3>JavaScript débutant</h3>
<iframe src="https://www.youtube.com/embed/hdI2bqOjy3c" allowfullscreen></iframe>
</div>

<div class="card">
<h3>DOM expliqué</h3>
<iframe src="https://www.youtube.com/embed/0ik6X4DJKCc" allowfullscreen></iframe>
</div>

<div class="card">
<h3>Projet JS simple</h3>
<iframe src="https://www.youtube.com/embed/Qqx_wzMmFeA" allowfullscreen></iframe>
</div>

</div>

<div class="badge" style="margin-top:40px;">Module 3 - Python</div>

<div class="grid">

<div class="card">
<h3>Python débutant</h3>
<iframe src="https://www.youtube.com/embed/_uQrJ0TkZlc" allowfullscreen></iframe>
</div>

<div class="card">
<h3>Variables & bases</h3>

</div>

</div>

</div>

</body>
